version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-demo:local
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      api:
        condition: service_healthy
    # uruchomi testy i zakończy się
    restart: "no"
