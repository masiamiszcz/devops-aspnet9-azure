name: CI/CD Main

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build-succeeded: ${{ steps.buildout.outcome }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'
      - name: Restore API
        run: dotnet restore DevOpsDemo.Api/DevOpsDemo.Api.csproj
      - name: Build API
        run: dotnet build DevOpsDemo.Api/DevOpsDemo.Api.csproj --no-restore --configuration Release
      - name: Upload build artifact (optional)
        if: success()
        run: echo "build ok"

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'
      - name: Restore Tests
        run: dotnet restore DevOpsDemo.Tests/DevOpsDemo.Tests.csproj
      - name: Build Tests
        run: dotnet build DevOpsDemo.Tests/DevOpsDemo.Tests.csproj --no-restore --configuration Release
      - name: Run Tests
        run: dotnet test DevOpsDemo.Tests/DevOpsDemo.Tests.csproj --no-build --verbosity normal

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-demo:latest DevOpsDemo.Api/

      # optional smoke test: run container and curl /health
      - name: Run container for smoke test
        run: |
          docker run --rm -d --name smoke-devops-demo -p 8080:8080 devops-demo:latest
          # wait for health to become healthy (simple loop)
          for i in {1..15}; do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "healthy"
              break
            fi
            echo "waiting..."
            sleep 2
          done
          curl -f http://localhost:8080/health
        timeout-minutes: 5

  deploy:
    needs: docker-build
    runs-on: ubuntu-latest
    if: success()  # only if all needs succeeded
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Triggering deploy on Render..."
          curl -s -f -X POST $RENDER_DEPLOY_HOOK -o /dev/null
