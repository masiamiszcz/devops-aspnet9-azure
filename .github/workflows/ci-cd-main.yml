name: CI/CD Main

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restore API
        run: dotnet restore DevOpsDemo.Api/DevOpsDemo.Api.csproj

      - name: Build API
        run: dotnet build DevOpsDemo.Api/DevOpsDemo.Api.csproj --no-restore --configuration Release

      - name: Upload build artifact (optional)
        if: success()
        run: echo "build ok"

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restore Tests
        run: dotnet restore DevOpsDemo.Tests/DevOpsDemo.Tests.csproj

      - name: Build Tests
        run: dotnet build DevOpsDemo.Tests/DevOpsDemo.Tests.csproj --no-restore --configuration Release

      - name: Run Tests
        run: dotnet test DevOpsDemo.Tests/DevOpsDemo.Tests.csproj --configuration Release --verbosity normal

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      - name: Build & tag image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/devops-demo:${{ github.sha }}
          echo "Image: $IMAGE"
          docker build -t $IMAGE -f Dockerfile .

      - name: Push image to GHCR
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/devops-demo:${{ github.sha }}
          docker push $IMAGE

      - name: Run container for smoke test
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/devops-demo:${{ github.sha }}
          docker run --rm -d --name smoke-devops-demo -p 8080:8080 $IMAGE
          for i in {1..15}; do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "healthy"
              break
            fi
            echo "waiting..."
            sleep 2
          done
          curl -f http://localhost:8080/health
        timeout-minutes: 5

  deploy:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure
        run: |
          echo "${{ secrets.AZURE_TOKEN }}" | az login --service-principal --username APP_ID --tenant TENANT_ID --password -
        env:
          AZURE_TOKEN: ${{ secrets.AZURE_TOKEN }}

      - name: Update Azure Container App image
        run: |
          APP_NAME="devopsdemo-api"
          RESOURCE_GROUP="rg-masiamiszcz-deploy"
          IMAGE=ghcr.io/${{ github.repository }}/devops-demo:${{ github.sha }}

          # Pobierz aktualną rewizję
          LATEST_REVISION=$(az containerapp revision list \
            --name $APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --query "[?properties.active].name | [0]" -o tsv)

          echo "Updating Container App to image: $IMAGE"
          az containerapp update \
            --name $APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --image $IMAGE

          echo "✅ Deployment triggered"
