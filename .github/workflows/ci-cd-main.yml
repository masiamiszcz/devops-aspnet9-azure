name: CI/CD Main

on:
  push:
    branches:
      - main

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      # Restore dependencies dla API i Tests
      - name: Restore API
        run: dotnet restore DevOpsDemo.Api/DevOpsDemo.Api.csproj

      - name: Restore Tests
        run: dotnet restore DevOpsDemo.Tests/DevOpsDemo.Tests.csproj

      # Build API
      - name: Build API
        run: dotnet build DevOpsDemo.Api/DevOpsDemo.Api.csproj --no-restore --configuration Release

      # Build Tests
      - name: Build Tests
        run: dotnet build DevOpsDemo.Tests/DevOpsDemo.Tests.csproj --no-restore --configuration Release

      # Run tests
      - name: Run Tests
        run: dotnet test DevOpsDemo.Tests/DevOpsDemo.Tests.csproj --verbosity normal

      # Build Docker image tylko dla projektu API
      - name: Build Docker image
        run: docker build -t devops-demo .
