name: CI/CD Main

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restore API
        run: dotnet restore DevOpsDemo.Api/DevOpsDemo.Api.csproj

      - name: Build API
        run: dotnet build DevOpsDemo.Api/DevOpsDemo.Api.csproj --no-restore --configuration Release

      - name: Upload build artifact (optional)
        if: success()
        run: echo "build ok"

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restore Tests
        run: dotnet restore DevOpsDemo.Tests/DevOpsDemo.Tests.csproj

      - name: Build Tests
        run: dotnet build DevOpsDemo.Tests/DevOpsDemo.Tests.csproj --no-restore --configuration Release

      - name: Run Tests
        run: dotnet test DevOpsDemo.Tests/DevOpsDemo.Tests.csproj --configuration Release --verbosity normal

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      - name: Build & tag image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/devops-demo
          echo "Building image $IMAGE with commit hash"
          docker build \
            --build-arg GIT_SHA=${GITHUB_SHA} \
            --no-cache \
            -t $IMAGE:latest \
            -t $IMAGE:${GITHUB_SHA::8} \
            -f Dockerfile .

      - name: Push image to GHCR
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/devops-demo
          echo "Pushing image $IMAGE:latest and commit tag"
          docker push $IMAGE:latest
          docker push $IMAGE:${GITHUB_SHA::8}

      - name: Run container for smoke test
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/devops-demo:latest
          docker run --rm -d --name smoke-devops-demo -p 8080:8080 $IMAGE
          for i in {1..15}; do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "healthy"
              break
            fi
            echo "waiting..."
            sleep 2
          done
          curl -f http://localhost:8080/health
        timeout-minutes: 5
